name: neurofit
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  pedometer: ^4.2.0
  permission_handler: ^13.0.1
  sensors_plus: ^7.1.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.6.0
  google_sign_in: ^6.2.2
  http: ^1.2.0
  shared_preferences: ^2.5.5
  mongo_dart: ^0.10.3
  socket_io_client: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/top tabs/
    - assets/images/top tabs/overview/
    - assets/images/top tabs/icons/
    - assets/images/kemo/
    - assets/images/island/
    - assets/videos/
    - assets/exercises/images/
    - assets/exercises/videos/
