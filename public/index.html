<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="NeuroFit - AI Fitness & Workout Tracking">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>NeuroFit</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B0F19;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .brand-logo {
      width: 80px;
      height: 80px;
      background: #1E293B;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #10B981;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.25);
      animation: pulse 2s infinite ease-in-out;
    }
    .brand-logo svg {
      width: 42px;
      height: 42px;
      fill: #10B981;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 2px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(16, 185, 129, 0.15);
      border-top: 3px solid #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>
    </div>
    <div class="brand-title">NEUROFIT</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
