name: Android APK (preview)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build APK (demo mode, debug-signed)
        run: flutter build apk --release --dart-define=DEMO_MODE=true

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk neurofit-preview.apk

      - name: Publish to the android-preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: NeuroFit Android preview
          body: |
            Demo build from ${{ github.sha }}. Download neurofit-preview.apk on an
            Android phone and allow installs from unknown sources.
          prerelease: true
          make_latest: false
          files: neurofit-preview.apk
