# Codemagic build for the Neurofit user app.
#
# ios-unsigned: builds an UNSIGNED .ipa (no Apple Developer account needed).
# Download "Neurofit.ipa" from the build's Artifacts and install it on your
# iPhone with Sideloadly or AltStore using your free Apple ID. The install
# expires after 7 days; just sideload it again.
#
# android-apk: builds a release APK you can install directly on Android.

workflows:
  ios-unsigned:
    name: iOS unsigned IPA (for Sideloadly / AltStore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/project-thread-rihxms
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS app without code signing
        # Flutter creates the Podfile and runs "pod install" itself here.
        script: |
          flutter precache --ios
          flutter build ios --release --no-codesign
      - name: Package as .ipa
        script: |
          rm -rf Payload Neurofit.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Neurofit.ipa Payload
          ls -lh Neurofit.ipa
    artifacts:
      - Neurofit.ipa

  android-apk:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
